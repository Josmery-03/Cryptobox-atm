<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoBox - Acceso</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="atm-container">
        <header class="atm-header">
            <div class="logo-container">
                <span class="crypto-icon">₿</span>
                <h1>CryptoBox</h1>
            </div>
            <p>Tu mundo digital, más cerca</p>
        </header>

        <main class="atm-body">
            <div class="auth-tabs">
                <button type="button" id="tabLogin" class="tab-btn active" onclick="cambiarTab('login')">Ingresar</button>
                <button type="button" id="tabRegister" class="tab-btn" onclick="cambiarTab('register')">Crear Cuenta</button>
            </div>

            <form id="authForm" class="atm-form">
                <div id="campoNombreContainer" class="hidden">
                    <label for="nombreRegistro">Nombre completo:</label>
                    <input type="text" id="nombreRegistro" placeholder="Ej: Josmery Bueno">
                </div>

                <label for="userEmail">Usuario o Correo:</label>
                <input type="text" id="userEmail" placeholder="Ej: estudiante_ucne" required>

                <label for="userPassword">Contraseña:</label>
                <input type="password" id="userPassword" placeholder="••••••••" required>

                <button type="submit" id="btnSubmitAuth" class="btn btn-verde" style="margin-top: 10px;">Iniciar Sesión</button>
            </form>

            <div id="mensajeEstado" class="status-message"></div>
        </main>
    </div>

    <script>
        let esRegistro = false;

        function cambiarTab(tipo) {
            esRegistro = (tipo === 'register');
            const btnSubmit = document.getElementById('btnSubmitAuth');
            const campoNombre = document.getElementById('campoNombreContainer');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const mensajeEstado = document.getElementById('mensajeEstado');
            mensajeEstado.style.display = 'none';

            if (esRegistro) {
                campoNombre.classList.remove('hidden');
                btnSubmit.textContent = 'Registrarse y Crear Wallet';
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
            } else {
                campoNombre.classList.add('hidden');
                btnSubmit.textContent = 'Iniciar Sesión';
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
            }
        }

        document.getElementById('authForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('userEmail').value.trim().toLowerCase();
            const pass = document.getElementById('userPassword').value.trim();
            const mensajeEstado = document.getElementById('mensajeEstado');
            mensajeEstado.style.display = 'block';

            if (!user || !pass) {
                mensajeEstado.textContent = "Error: Complete todos los campos.";
                mensajeEstado.className = "status-message status-error";
                return;
            }

            let usuarios = JSON.parse(localStorage.getItem('cryptoBoxUsuarios')) || {};

            if (esRegistro) {
                if (usuarios[user]) {
                    mensajeEstado.textContent = "Error: Este usuario ya está registrado.";
                    mensajeEstado.className = "status-message status-error";
                    return;
                }
                usuarios[user] = {
                    password: pass,
                    saldo: 100.00,
                    historial: ['Cuenta creada: +100.00 TKIA (Bono inicial)']
                };
                localStorage.setItem('cryptoBoxUsuarios', JSON.stringify(usuarios));
                localStorage.setItem('cryptoBoxCurrentUser', user);

                mensajeEstado.textContent = "¡Cuenta creada con éxito! Redirigiendo...";
                mensajeEstado.className = "status-message status-exito";
                setTimeout(() => { window.location.href = 'index.html'; }, 1200);

            } else {
                if (!usuarios[user] || usuarios[user].password !== pass) {
                    mensajeEstado.textContent = "Error: Usuario o contraseña incorrectos.";
                    mensajeEstado.className = "status-message status-error";
                    return;
                }

                localStorage.setItem('cryptoBoxCurrentUser', user);
                mensajeEstado.textContent = "¡Acceso concedido! Redirigiendo...";
                mensajeEstado.className = "status-message status-exito";
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            }
        });
    </script>
</body>
</html>
